<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <pattern id="ruled" width="900" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="23" x2="900" y2="23" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .title { font: 800 32px 'Comic Sans MS', 'Segoe UI', cursive, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
    .sub { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
    .tag { font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: #2563eb; letter-spacing: 1px; }
    .wiggle { animation: wiggle 3.5s ease-in-out infinite; transform-origin: 790px 110px; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
  <rect width="900" height="220" rx="14" fill="#fdfbf7"/>
  <rect width="900" height="220" rx="14" fill="url(#ruled)"/>
  <line x1="42" y1="0" x2="42" y2="220" stroke="#fca5a5" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="216" rx="12" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Sketchbook Sticky Note -->
  <g class="wiggle">
    <rect x="730" y="54" width="120" height="110" rx="4" fill="#fef08a" stroke="#1e293b" stroke-width="2"/>
    <circle cx="790" cy="66" r="5" fill="#ef4444" class="pulse"/>
    <line x1="746" y1="92" x2="834" y2="92" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="746" y1="112" x2="820" y2="112" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <line x1="746" y1="132" x2="800" y2="132" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="64" y="70" class="tag">HTML5  •  CSS3  •  VANILLA JS  •  SUPABASE REALTIME</text>
  <text x="64" y="112" class="title">THE WIMPY CREDENTIALS BOOK</text>
  <path d="M 64 124 Q 180 130 310 124" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="64" y="156" class="sub">Live Schedule  •  Resource Cabinet  •  Freedom Wall  •  Group Chat</text>
</svg>
